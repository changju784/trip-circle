<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <style>
      /* Soft white clouds, low opacity for subtle texture against the blue bg */
      .cloud { fill: #ffffff; opacity: 0.25; }
      /* The trail color matches your original cyan, slightly transparent */
      .trail { stroke: #79cfdb; stroke-width: 3; fill: none; stroke-linecap: round; opacity: 0.5; }
      /* The plane color matches your original cyan, mostly opaque */
      .plane { fill: #79cfdb; opacity: 0.9; }
    </style>
  </defs>

  <g class="cloud" transform="translate(40, 50)">
    <circle cx="0" cy="0" r="25" />
    <circle cx="30" cy="-10" r="20" />
    <circle cx="35" cy="15" r="22" />
    <circle cx="-15" cy="15" r="18" />
  </g>

  <g class="cloud" transform="translate(200, 190)">
    <circle cx="0" cy="0" r="30" />
    <circle cx="-35" cy="5" r="22" />
    <circle cx="-20" cy="-20" r="25" />
    <circle cx="25" cy="-15" r="18" />
  </g>

  <path class="trail" d="M-20,160 C 60,100 140,200 260,80" />

  <g class="plane" transform="translate(185, 105) rotate(-35)">
    <path d="M0,0 L24,-8 L18,0 L24,8 Z" />
  </g>
</svg>