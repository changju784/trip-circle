<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <style>
      /* Night clouds: White but very low opacity to look like faint night sky texture */
      .cloud { fill: #ffffff; opacity: 0.08; }
      
      /* Trails: Soft Gray, low opacity so they don't distract from the content */
      .trail { stroke: #6b7280; stroke-width: 3; fill: none; stroke-linecap: round; opacity: 0.3; }
      
      /* Plane: A muted slate-blue/grey to stay visible but subtle against dark bg */
      .plane { fill: #94a3b8; opacity: 0.8; }
    </style>
  </defs>

  <g class="cloud" transform="translate(40, 50)">
    <circle cx="0" cy="0" r="25" />
    <circle cx="30" cy="-10" r="20" />
    <circle cx="35" cy="15" r="22" />
    <circle cx="-15" cy="15" r="18" />
  </g>

  <g class="cloud" transform="translate(200, 190)">
    <circle cx="0" cy="0" r="30" />
    <circle cx="-35" cy="5" r="22" />
    <circle cx="-20" cy="-20" r="25" />
    <circle cx="25" cy="-15" r="18" />
  </g>

  <path class="trail" d="M-20,160 C 60,100 140,200 260,80" />

  <g class="plane" transform="translate(185, 105) rotate(-35)">
    <path d="M0,0 L24,-8 L18,0 L24,8 Z" />
  </g>
</svg>